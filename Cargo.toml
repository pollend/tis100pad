[package]
name = "tis100-pad"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dev"
path = "src/dev.rs"

[workspace]
members= ["tis100"]

[dependencies]
tis100 = { path = "tis100" }
axum = {version = "0.8.3", features = ["multipart", "http2"]}
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-sessions-sqlx-store = {version = "0.15.0", features = ["postgres"]}
tower-sessions = {version = "0.14.0", features = []}
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.1", features = ["fs", "trace"] }
serde_json = "1.0"
askama = {git = "https://github.com/askama-rs/askama.git", rev = "df54534ae6e7600921df60ed38f3ba65196ba39e" ,features = ["blocks", "serde_json"]}
axum-extra = "0.10.1"
sqlx = {version = "0.8.5", features = ["time", "runtime-tokio", "bigdecimal", "uuid"]}
clap = { version = "4.5.35", features = ["derive"] }
argon2 = {version = "0.5.3", features = ["std"]}
time = {version = "0.3.36", features=["formatting"]}
base64 = { version = "0.22.0", default-features = false, features = ["std"] }
mime = "0.3.16"
fake = { version = "4.3.0", features = ["time"] }
futures = "0.3.31"
bigdecimal = "0.4.8"
rmp-serde = "1.3.0"
async-stream = "0.3.6"
sync_wrapper = { version = "1"}
http-body = { version = "1.0"}
futures-util = { version = "0.3"}
pin-project-lite = "0.2"
memchr = "2.7.4"
bytes = "1.10.1"
itoa = "1.0.5"
const_format = "0.2.34"
rand = { version = "0.8", features = ["small_rng"] }
toml = "0.8.22"
serde_urlencoded = "0.7"


